syntax = "proto3";
package summator;

service SummatorService {
  rpc Sum (SumRequest) returns (SumResponse);
}
message SumResponse {
  // bool ok = 1;
  int32 result = 1;
//  repeated SumResponseError error = 3;
}
message SumResponseResult {
  int32 a = 1;
  int32 b = 2;
}
message SumResponseError {
  string code = 1;
  string msg = 2;
}

message SumRequest {
  int32 a = 1;
  int32 b = 2;
}