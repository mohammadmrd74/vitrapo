version: '3.4'
services:
  nestapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitrapo-app 
    restart: always
    network_mode: "host"
  minio:
    image: 'bitnami/minio:latest'
    container_name: minio
    restart: always
    logging:
        options:
            max-size: 1m
    environment:
        - MINIO_ROOT_USER=vitrapo
        - MINIO_ROOT_PASSWORD=vitrapo123
    network_mode: "host"
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config