services:
  nestapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitrapo-app
    restart: always
    environment:
      - DATABASE_URL=file:/data/dev.db
      - APP_ENV=production
      - APP_PORT=4000
      - APP_NAME=vitrapo
      - FILE_STORAGE_PATH=/data/uploads
      - FILE_BASE_URL=/files
      # Set SMS_SKIP=1 here to enable real SMS via sms.ir in prod.
    volumes:
      - app_data:/data
    expose:
      - "4000"
    command: sh -c "npx prisma db push --skip-generate && node dist/main.js"

  frontapp:
    build:
      context: ../Vitrapo-CRM
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/
    container_name: vitrapo-front
    restart: always
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nestapp
      - frontapp

volumes:
  app_data:
  caddy_data:
  caddy_config:
